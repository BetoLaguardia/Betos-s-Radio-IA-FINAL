    <script>
      (function () {
        function ensureWritableFetch(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && (!desc.writable || (desc.get && !desc.set))) {
              if (desc.configurable) {
                var currentFetch = target.fetch || window.fetch;
                Object.defineProperty(target, 'fetch', {
                  value: currentFetch,
                  writable: true,
                  enumerable: desc.enumerable !== false,
                  configurable: true,
                });
              }
            } else if (!desc && target === window) {
              var proto = Object.getPrototypeOf(window);
              var protoDesc = proto && Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (protoDesc && protoDesc.get && !protoDesc.set) {
                Object.defineProperty(window, 'fetch', {
                  value: window.fetch,
                  writable: true,
                  enumerable: true,
                  configurable: true,
                });
              }
            }
          } catch (e) {}
        }

        ensureWritableFetch(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          ensureWritableFetch(Window.prototype);
        }

        window.addEventListener(
          'error',
          function (event) {
            var filename = event && event.filename ? String(event.filename) : '';
            var msg = event && event.message ? String(event.message) : '';
            if (
              filename.indexOf('chrome-extension://') === 0 &&
              msg.indexOf('fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
